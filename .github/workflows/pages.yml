name: Publish presentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test engine, translation and local editor
        run: python -m unittest discover -v
      - name: Build the standalone offline presentation
        run: python build.py
      - name: Check that the offline export matches the sources
        run: git diff --exit-code -- index.html
      - name: Stage the presentation
        run: |
          mkdir -p "$RUNNER_TEMP/presentation-site"
          cp index.html "$RUNNER_TEMP/presentation-site/index.html"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/presentation-site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy presentation
        id: deployment
        uses: actions/deploy-pages@v4
